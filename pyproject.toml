[project]
name = "prodpath"
version = "0.0.1"
description = "Local, read-only CLI agent that reads a codebase and plans its path to production."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "httpx",
    "jinja2",
    "tree-sitter",
    "tree-sitter-language-pack",
    "pyyaml>=6.0.3",
]

[project.scripts]
prodpath = "prodpath.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prodpath"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["llm: slow tests that hit local Ollama (run with -m llm)"]
addopts = "-m 'not llm'"

[tool.ruff.lint.per-file-ignores]
# AWS CLI command templates and prose read better unbroken; copy-paste matters more here.
"src/prodpath/providers/aws/steps.py" = ["E501"]
